# Builds offline map layers for Saudi Arabia from OpenStreetMap (Geofabrik GCC extract) and pushes them to the osm-data branch.
name: osm-extract
on:
  push:
    branches: [main]
    paths: ['tools/osm/**', '.github/workflows/osm-extract.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install osmium
        run: sudo apt-get update -qq && sudo apt-get install -y -qq osmium-tool
      - name: Download GCC extract
        run: curl -sSfL -o gcc.osm.pbf https://download.geofabrik.de/asia/gcc-states-latest.osm.pbf && ls -la gcc.osm.pbf
      - name: Cut Saudi box and filter
        run: |
          osmium extract -b 34.4,16.3,55.8,32.3 gcc.osm.pbf -o ksa.osm.pbf
          osmium tags-filter ksa.osm.pbf w/highway=motorway,trunk,primary,secondary,tertiary w/waterway=wadi,river,stream wa/landuse=residential n/place=city,town,village -o sel.osm.pbf
          osmium export sel.osm.pbf -f geojsonseq -o sel.geojsonseq --geometry-types=point,linestring,polygon
          ls -la sel.osm.pbf sel.geojsonseq
      - name: Build layers
        run: mkdir -p out && python3 tools/osm/build.py sel.geojsonseq out && ls -la out
      - name: Push to osm-data branch
        run: |
          cd out
          git init -q -b osm-data
          git config user.name "github-actions"; git config user.email "github-actions@users.noreply.github.com"
          echo "OSM-derived layers for Saudi Arabia. Data (c) OpenStreetMap contributors, ODbL 1.0, via Geofabrik." > README.md
          git add -A && git commit -qm "OSM layers $(date -u +%F)"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}" osm-data
